<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 홈 화면 아이콘 마스터. 이 파일 하나만 고치면 gen-icons 로 PNG·파비콘이 모두 갱신됩니다. -->
  <!-- 색/모양 바꾸는 곳: BG(배경) / ACCENT(강조) 값만 바꾸세요. -->
  <rect width="512" height="512" rx="0" fill="#111827"/>
  <!-- 중앙 강조 타일 (maskable 안전영역 안) -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="#0b1220"/>
  <rect x="96" y="96" width="320" height="320" rx="72" stroke="#1f2937" stroke-width="4"/>
  <!-- π 심볼 (ACCENT: #22c55e) -->
  <g fill="#22c55e">
    <rect x="168" y="188" width="176" height="40" rx="12"/>
    <rect x="196" y="220" width="40" height="120" rx="12"/>
    <rect x="300" y="220" width="40" height="120" rx="12"/>
  </g>
  <!-- 제곱 강조 점 -->
  <circle cx="344" cy="180" r="16" fill="#34d399"/>
</svg>
